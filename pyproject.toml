[tool.poetry]
name = "altron"
version = "0.1.0"
description = "Production foundation for Altron desktop AI assistant"
authors = ["Ashish <ashish@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0.0" }
alembic = "^1.10.0"
asyncpg = "^0.29.0"
aiosqlite = "^0.10.0"
redis = "^5.0.0"
pydantic-settings = "^2.7.0"
httpx = "^0.27.0"
groq = "^0.10.0"
edge-tts = "^7.2.8"
loguru = "^0.6.0"
sounddevice = "^0.5.0"
numpy = "^2.0.0"
faster-whisper = "^1.0.0"
openwakeword = "^0.6.0"
soundfile = "^0.12.0"
pytest = "^8.3.0"
pytest-asyncio = "^0.23.0"
ruff = "^0.6.0"
mypy = "^1.11.0"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
